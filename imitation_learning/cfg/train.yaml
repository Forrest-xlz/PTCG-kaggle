version_name: pure_baseline

train:
  cg_path: ../pokemon_tcg_ai_battle/sample_submission
  data: data/training_cache
  output: outputs/${version_name}
  epochs: 3
  batch_size: 4096
  learning_rate: 0.0003
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  warmup_steps: 100
  max_samples: null  # Use null for every extracted sample.
  seed: 42
  device: cuda         # auto, cpu, cuda, or cuda:0
  precision: bf16      # fp32, fp16, or bf16
  log_every_steps: 10
  eval_every_steps: 1000
  save_every_steps: 1000
  save_every_epoch: true
  ema_alpha: 0.99
  validation_ratio: 0.05
  validation_seed: 42
  grad_clip_norm: 1.0

model:
  d_model: 128
  ffn_multiplier: 2     # d_feedforward = d_model * ffn_multiplier
  num_heads: 2          # d_model must be divisible by num_heads.
  encoder_layers: 1
  decoder_layers: 1
  norm_mode: postnorm   # prenorm or postnorm

wandb:
  enabled: true
  project: ptcg_bc
  group: pure_bc
  name: ${version_name}
  mode: online          # online, offline, or disabled
