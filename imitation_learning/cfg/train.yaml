version_name: ver_1.6.0

train:
  cg_path: ../pokemon_tcg_ai_battle/sample_submission
  data: data/training_cache
  replay_episodes: ../replay_episodes
  output: outputs/${version_name}
  resume: false
  resume_checkpoint: null  # Example: outputs/ver_1.6.0/checkpoints/epoch-002.pt
  epochs: 5
  batch_size: 4096
  learning_rate: 0.0003
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  warmup_steps: 100
  max_samples: null  # Use null for every extracted sample.
  seed: 42
  device: cuda         # auto, cpu, cuda, or cuda:0
  precision: bf16      # fp32, fp16, or bf16
  damage_counter_ko_mask: true  # Mask HP<=0 targets when a live target exists.
  log_every_steps: 10
  eval_every_steps: 270
  save_every_steps: 1000
  save_every_epoch: true
  ema_alpha: 0.99
  validation_ratio: 0.05
  validation_seed: 42
  expert_validation_ratio: 0.05
  loser_augmentation:
    enabled: true
    recent_dates: 3      # Latest training dates after latest-date validation.
    expert_ratio: 0.05   # Daily top-player fraction used for the cutoff.
  isolation_validation:
    deck_data: data/deck
    selections:
      deck_isolation: data/deck_isolation_selection.csv
      archetype_isolation: data/archetype_isolation_selection.csv
      top_deck_archetype_isolation: data/top_deck_archetype_isolation_selection.csv
  top_decks:
    - [7, 7, 7, 7, 7, 7, 7, 7, 7, 7,
       104, 104, 112, 112, 112, 112,
       646, 646, 646, 646, 647, 647, 647, 648, 648, 648,
       860, 860, 1079, 1079, 1079, 1080,
       1086, 1086, 1086, 1086, 1097, 1097, 1097, 1122, 1137,
       1152, 1152, 1152, 1152, 1182, 1182,
       1219, 1219, 1219, 1219, 1227, 1227, 1227, 1227,
       1231, 1259, 1259, 1259, 1259]  # grimmsnarl

    - [5,5,13,19,19,19,19,66,66,140,305,305,305,343,741,741,741,741,742,742,742,742,743,743,
      743,743,1079,1079,1079,1081,1081,1081,1081,1086,
      1086,1086,1086,1097,1129,1152,1152,1152,1152,1182,1182,1182,1184,1197,1197,1197,
      1225,1225,1225,1225,1231,1231,1231,1231,1266,1266]  # alakazam

    - [3,3,3,11,11,11,11,13,66,66,66,174,305,305,305,305,848,848,849,849,860,860,861,861,
      1086,1086,1086,1086,1087,1087,1087,1121,1121,1121,1121,1122,1122,1152,1152,1152,1152,
      1174,1174,1174,1182,1182,1225,1225,1225,1227,1227,1227,1227,1229,1229,1229,1229,1264,1264,1264] # mega froslass
    
    

    
  train_replay_ratio: 1.0
  train_replay_seed: 42
  grad_clip_norm: 1.0

model:
  d_model: 512
  ffn_multiplier: 4     # d_feedforward = d_model * ffn_multiplier
  num_heads: 8          # d_model must be divisible by num_heads.
  encoder_layers: 3
  decoder_layers: 3
  norm_mode: postnorm   # prenorm or postnorm
  transformer_activation: geglu # relu, gelu (tanh approximation), or geglu.
  transformer_dropout: 0.1
  dropout_embedding: true          # LayerNorm + dropout on encoder/action inputs.
  dropout_attention_probs: true    # After attention softmax.
  dropout_attention_output: true   # After attention output projection.
  dropout_ffn_output: true         # After FFN output projection.
  summary_mlp_layers: 3         # Own/opponent/global summary projections.
  card_mlp_layers: 1            # 0 disables every static-card embedding.
  card_mlp_scope: shared        # shared or region-specific projection MLPs.
  option_numeric_mlp_layers: 3  # Five non-embedded option numbers -> d_model.
  option_token_mlp_layers: 2    # 0=sum embeddings; >0 applies post-sum d_model MLP.
  pokemon_appear_embedding: true
  bench_token_mlp_layers: 2     # Separate own/opponent weights.
  active_token_mlp_layers: 2    # Separate own/opponent weights.
  discard_token_mlp_layers: 2   # Separate own/opponent weights.
  hand_token_mlp_layers: 2      # Own hand token only.
  deck_token_mlp_layers: 2      # Own remaining-deck token only.
  revealed_hand_token_mlp_layers: 1 # Separate own/opponent revealed-hand MLPs.
  learnable_cls_token: true     # Add one learned global encoder workspace.
  region_token_mlp_residual: false
  history_encoding: full          # off, basic, structural, or full.
  history_action_mlp_layers: 1   # Shared by the three historical actions.
  history_sequence_mlp_layers: 2 # [t-3,t-2,t-1] concatenation -> one token.

wandb:
  enabled: true
  project: ptcg_bc
  group: pure_bc
  name: ${version_name}
  mode: online          # online, offline, or disabled
