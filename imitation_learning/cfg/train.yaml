version_name: ver_final_f

train:
  cg_path: ../pokemon_tcg_ai_battle/sample_submission
  data: data/training_cache
  replay_episodes: ../replay_episodes
  output: outputs/${version_name}
  resume: false
  resume_checkpoint: null  # Example: outputs/ver_final_f/checkpoints/epoch-002.pt
  epochs: 5
  batch_size: 4096
  learning_rate: 0.0003
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  warmup_steps: 100
  max_samples: null  # Use null for every extracted sample.
  seed: 42
  device: cuda         # auto, cpu, cuda, or cuda:0
  precision: bf16      # fp32, fp16, or bf16
  log_every_steps: 10
  save_every_steps: 1000
  save_every_epoch: true
  ema_alpha: 0.99
  loser_augmentation:
    enabled: true
    recent_dates: 3      # Latest cached dates.
    expert_ratio: 0.05   # Daily top-player fraction used for the cutoff.
  train_replay_ratio: 1.0
  train_replay_seed: 42
  grad_clip_norm: 1.0

model:
  d_model: 512
  ffn_multiplier: 4     # d_feedforward = d_model * ffn_multiplier
  num_heads: 8          # d_model must be divisible by num_heads.
  encoder_layers: 3
  decoder_layers: 3
  norm_mode: postnorm   # prenorm or postnorm
  transformer_activation: geglu # relu, gelu (tanh approximation), or geglu.
  transformer_dropout: 0.1
  dropout_embedding: true          # LayerNorm + dropout on encoder/action inputs.
  dropout_attention_probs: true    # After attention softmax.
  dropout_attention_output: true   # After attention output projection.
  dropout_ffn_output: true         # After FFN output projection.
  summary_mlp_layers: 3         # Own/opponent/global summary projections.
  card_mlp_layers: 1            # 0 disables every static-card embedding.
  card_mlp_scope: shared        # shared or region-specific projection MLPs.
  option_numeric_mlp_layers: 3  # Five non-embedded option numbers -> d_model.
  option_token_mlp_layers: 2    # 0=sum embeddings; >0 applies post-sum d_model MLP.
  pokemon_appear_embedding: true
  bench_token_mlp_layers: 2     # Separate own/opponent weights.
  active_token_mlp_layers: 2    # Separate own/opponent weights.
  discard_token_mlp_layers: 2   # Separate own/opponent weights.
  hand_token_mlp_layers: 2      # Own hand token only.
  deck_token_mlp_layers: 2      # Own remaining-deck token only.
  known_deck_token_mlp_layers: 1 # Known physical cards currently in own deck.
  region_token_mlp_residual: false
  history_encoding: full          # off, basic, structural, or full.
  history_action_mlp_layers: 1   # Shared by the three historical actions.
  history_sequence_mlp_layers: 2 # [t-3,t-2,t-1] concatenation -> one token.

wandb:
  enabled: true
  project: ptcg_bc
  group: pure_bc
  name: ${version_name}
  mode: online          # online, offline, or disabled
