version_name: ver_

train:
  cg_path: ../pokemon_tcg_ai_battle/sample_submission
  data: data/training_cache
  replay_episodes: ../replay_episodes
  output: outputs/${version_name}
  data_selection_mode: holdout  # holdout or full_data
  resume: false
  resume_checkpoint: null  # Example: outputs/ver_1.6.0/checkpoints/epoch-002.pt
  epochs: 5
  batch_size: 4096
  learning_rate: 0.0003
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  warmup_steps: 100
  max_samples: null  # Use null for every extracted sample.
  seed: 42
  device: cuda         # auto, cpu, cuda, or cuda:0
  precision: bf16      # fp32, fp16, or bf16
  log_every_steps: 10
  eval_every_steps: 270
  save_every_steps: 1000
  save_every_epoch: true
  ema_alpha: 0.99
  validation_ratio: 0.05
  validation_seed: 42
  expert_validation_ratio: 0.05
  loser_augmentation:
    enabled: true
    recent_dates: 25      # Latest eligible dates; holdout excludes latest date.
    expert_ratio: 0.06   # Daily top-player fraction used for the cutoff.
  isolation_validation:
    deck_data: data/deck
    selections:
