version_name: pure_baseline

train:
  cg_path: ../pokemon_tcg_ai_battle/sample_submission
  data: data/training_cache
  replay_episodes: ../replay_episodes
  output: outputs/${version_name}
  epochs: 3
  batch_size: 4096
  learning_rate: 0.0003
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  warmup_steps: 100
  max_samples: null  # Use null for every extracted sample.
  seed: 42
  device: cuda         # auto, cpu, cuda, or cuda:0
  precision: bf16      # fp32, fp16, or bf16
  log_every_steps: 10
  eval_every_steps: 1000
  save_every_steps: 1000
  save_every_epoch: true
  ema_alpha: 0.99
  validation_ratio: 0.05
  validation_seed: 42
  expert_validation_ratio: 0.05
  isolation_validation:
    deck_data: data/deck
    selections:
      deck_isolation: data/deck_isolation_selection.csv
      archetype_isolation: data/archetype_isolation_selection.csv
      top_deck_archetype_isolation: data/top_deck_archetype_isolation_selection.csv
  top_decks:
    - [7, 7, 7, 7, 7, 7, 7, 7, 7, 7,
       104, 104, 112, 112, 112, 112,
       646, 646, 646, 646, 647, 647, 647, 648, 648, 648,
       860, 860, 1079, 1079, 1079, 1080,
       1086, 1086, 1086, 1086, 1097, 1097, 1097, 1122, 1137,
       1152, 1152, 1152, 1152, 1182, 1182,
       1219, 1219, 1219, 1219, 1227, 1227, 1227, 1227,
       1231, 1259, 1259, 1259, 1259]
  train_replay_ratio: 1.0
  train_replay_seed: 42
  grad_clip_norm: 1.0

model:
  d_model: 128
  ffn_multiplier: 2     # d_feedforward = d_model * ffn_multiplier
  num_heads: 2          # d_model must be divisible by num_heads.
  encoder_layers: 1
  decoder_layers: 1
  norm_mode: postnorm   # prenorm or postnorm
  summary_mlp_layers: 1         # Own/opponent/global summary projections.
  card_mlp_layers: 1            # 0 disables every static-card embedding.
  card_mlp_scope: region        # shared or region-specific projection MLPs.
  option_numeric_mlp_layers: 1  # Five non-embedded option numbers -> d_model.
  option_token_mlp_layers: 0    # 0=sum embeddings; >0 applies post-sum d_model MLP.
  use_option_index: true
  use_option_tool_index: true
  use_option_energy_index: true
  use_option_in_play_index: true
  use_option_relative_position: false  # Current ablation target; cache is reusable.
  pokemon_appear_embedding: true
  bench_token_mlp_layers: 1     # Separate own/opponent weights.
  active_token_mlp_layers: 1    # Separate own/opponent weights.
  discard_token_mlp_layers: 1   # Separate own/opponent weights.
  hand_token_mlp_layers: 1      # Own hand token only.
  deck_token_mlp_layers: 1      # Own remaining-deck token only.
  region_token_mlp_residual: true

wandb:
  enabled: true
  project: ptcg_bc
  group: pure_bc
  name: ${version_name}
  mode: online          # online, offline, or disabled
