version_name: value_v1

value_train:
  cg_path: ../pokemon_tcg_ai_battle/sample_submission
  data: data/training_cache
  replay_episodes: ../replay_episodes
  pretrained_checkpoint: final_d2_33.pt  # Policy checkpoint; encoder architecture and weights are loaded automatically.
  output: outputs/${version_name}
  resume: false
  resume_checkpoint: null                # Value checkpoint, required only when resume is true.
  epochs: 3
  batch_size: 4096
  learning_rate: 0.0001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  warmup_steps: 100
  eval_every_steps: 200
  save_every_steps: 1000
  save_every_epoch: true
  validation_ratio: 0.05
  validation_seed: 42
  expert_validation_ratio: 0.05
  seed: 42
  device: cuda                         # auto, cpu, cuda, or cuda:0
  precision: bf16                      # fp32, fp16, or bf16
  log_every_steps: 10
  grad_clip_norm: 1.0
  ema_alpha: 0.99
  isolation_validation:
    deck_data: data/deck
    selections:
      deck_isolation: data/deck_isolation_selection.csv
      archetype_isolation: data/archetype_isolation_selection.csv
      top_deck_archetype_isolation: data/top_deck_archetype_isolation_selection.csv
  top_decks:
    - [7, 7, 7, 7, 7, 7, 7, 7, 7, 7,
       104, 104, 112, 112, 112, 112,
       646, 646, 646, 646, 647, 647, 647, 648, 648, 648,
       860, 860, 1079, 1079, 1079, 1080,
       1086, 1086, 1086, 1086, 1097, 1097, 1097, 1122, 1137,
       1152, 1152, 1152, 1152, 1182, 1182,
       1219, 1219, 1219, 1219, 1227, 1227, 1227, 1227,
       1231, 1259, 1259, 1259, 1259]  # Grimmsnarl
    - [5, 5, 13, 19, 19, 19, 19, 66, 66, 140, 305, 305, 305, 343,
       741, 741, 741, 741, 742, 742, 742, 742, 743, 743, 743, 743,
       1079, 1079, 1079, 1081, 1081, 1081, 1081, 1086, 1086, 1086, 1086,
       1097, 1129, 1152, 1152, 1152, 1152, 1182, 1182, 1182, 1184,
       1197, 1197, 1197, 1225, 1225, 1225, 1225, 1231, 1231, 1231, 1231,
       1266, 1266]  # Alakazam
    - [3, 3, 3, 11, 11, 11, 11, 13, 66, 66, 66, 174,
       305, 305, 305, 305, 848, 848, 849, 849, 860, 860, 861, 861,
       1086, 1086, 1086, 1086, 1087, 1087, 1087, 1121, 1121, 1121, 1121,
       1122, 1122, 1152, 1152, 1152, 1152, 1174, 1174, 1174, 1182, 1182,
       1225, 1225, 1225, 1227, 1227, 1227, 1227, 1229, 1229, 1229, 1229,
       1264, 1264, 1264]  # Mega Froslass

value_model:
  head_layers: 2  # 1 means d_model -> scalar; each extra layer adds d_model -> d_model.
  dropout: 0.0
  output_activation: tanh

wandb:
  enabled: true
  project: ptcg_value
  group: value_pretrain
  name: ${version_name}
  mode: online
